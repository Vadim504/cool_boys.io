name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]  # При пуше в main или master
  pull_request:
    branches: [ main, master ]

# Разрешения для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Позволяет одно одновременное развертывание
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"  # Версия Node.js
          cache: 'npm'  # Кэширование зависимостей

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend  # Папка с проектом

      - name: Build
        run: npm run build
        working-directory: ./frontend  # Собираем из папки frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist  # Папка с собранным проектом

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
